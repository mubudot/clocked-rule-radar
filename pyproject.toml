[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clocked-rule-radar"
version = "0.1.0"
description = "See what changed in a contest's rules, ranked for you, every line verified — built on Clocked Compare, Rerank, Verify and Extract."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ethan Moore (mubudot)" }]
requires-python = ">=3.10"
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rule-radar = "rule_radar.__main__:main"

[tool.setuptools.packages.find]
include = ["rule_radar*"]

[tool.setuptools.package-data]
rule_radar = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
